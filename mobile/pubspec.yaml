name: eduagent_mobile
description: EduAgent 教育领域 AI Agent 移动端（iOS/Android 一套代码）。
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  # theme.dart 使用 CardThemeData（3.27+ 规范化后的主题数据类），下限据此设定
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  # 路由
  go_router: ^14.2.0
  # 网络（API client 手写，避免 build_runner 代码生成的复杂度）
  dio: ^5.5.0
  # 本地存储：Hive（设置/草稿/离线队列）+ SQLite（结构化缓存）
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  # token / API Key 安全存储（禁止明文）
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.4
  # Markdown + LaTeX 渲染
  flutter_markdown: ^0.7.3+1
  markdown: ^7.2.2
  flutter_math_fork: ^0.7.2
  # 图片查看
  photo_view: ^0.15.0
  # 文件 / 拍照
  file_picker: ^12.0.0
  image_picker: ^1.1.2
  # 语音录制 / 播放
  record: ^6.1.2
  just_audio: ^0.9.42
  # 图表（学情看板）
  fl_chart: ^0.68.0
  # 导出链接打开
  url_launcher: ^6.3.0
  # 工具
  uuid: ^4.4.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  fonts:
    # HarmonyOS Sans SC（华为开源字体，授权见 assets/fonts/LICENSE.txt）
    # 仅作标题/展示字体使用，正文保持系统字体
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_Sans_SC_Bold.ttf
          weight: 700
