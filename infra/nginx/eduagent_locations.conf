# ============================================================================
# EduAgent 路由规则（被 nginx.conf 的 :80 / :443 server 块 include）
# 仅包含 location 级别配置，公共代理头在此统一设置
# ============================================================================

# --------------------------------------------------------------------------
# 1. SSE 流式聊天接口（长连接、逐 token 下发，严禁缓冲）
# --------------------------------------------------------------------------
location = /api/v1/chat/completions {
    limit_req zone=api_per_ip burst=60 nodelay;

    proxy_pass http://bff_backend;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";          # 清除逐跳头，启用 keepalive

    # —— SSE 关键配置 ——
    proxy_buffering    off;                         # 不缓冲上游响应，立即下发
    proxy_cache        off;
    chunked_transfer_encoding on;
    proxy_read_timeout 600s;                        # 长推理（含思考链）不断连
    proxy_send_timeout 600s;
    # 注：BFF 的 SSE 响应同时携带 `X-Accel-Buffering: no` 响应头双保险
}

# --------------------------------------------------------------------------
# 2. 鉴权端点（更严限流，防爆破/撞库）
# --------------------------------------------------------------------------
location /api/v1/auth/ {
    limit_req zone=auth_per_ip burst=10 nodelay;

    proxy_pass http://bff_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 60s;
}

# --------------------------------------------------------------------------
# 3. WebSocket（/ws → bff，需要 Upgrade 头）
# --------------------------------------------------------------------------
location /ws {
    proxy_pass http://bff_backend;

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 3600s;                       # 长连接保活（BFF 侧需配心跳）
    proxy_send_timeout 3600s;
    proxy_buffering    off;
}

# --------------------------------------------------------------------------
# 4. 常规 API
# --------------------------------------------------------------------------
location /api/ {
    limit_req zone=api_per_ip burst=60 nodelay;

    proxy_pass http://bff_backend;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    proxy_read_timeout 120s;                        # 常规请求 2 分钟足够；长任务走异步 202 轮询
}

# --------------------------------------------------------------------------
# 5. 静态资源（可选：管理端 Web / 落地页；产物文件一律走 MinIO 预签名 URL）
# --------------------------------------------------------------------------
location / {
    root   /usr/share/nginx/html;
    index  index.html;
    try_files $uri $uri/ /index.html;               # SPA history 路由回退

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
