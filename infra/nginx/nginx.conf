# ============================================================================
# EduAgent Nginx 反向代理
# 职责：SSL 终止 / 路由分发 / SSE 流式透传 / WebSocket Upgrade / 静态资源 / 限流
# 网络：仅接入 net_edge，只可达 bff（永远接触不到数据层与推理层）
# ============================================================================

user  nginx;
worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------
    # 日志
    # ------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'uct="$upstream_connect_time" urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    # ------------------------------------------------------------------
    # 基础性能
    # ------------------------------------------------------------------
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    client_max_body_size 50m;        # 大文件走 MinIO 预签名 URL 直传，此处仅兜底小文件

    # ------------------------------------------------------------------
    # gzip
    # ------------------------------------------------------------------
    gzip                on;
    gzip_vary           on;
    gzip_comp_level     6;
    gzip_min_length     1024;        # SSE 流式响应逐 token 输出，远小于该值且 content-type 不在列表，不会被缓冲压缩
    gzip_types          text/plain text/css application/json application/javascript
                        application/xml image/svg+xml;

    # ------------------------------------------------------------------
    # WebSocket Upgrade 映射
    # ------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------
    # 限流（按客户端 IP 的粗粒度限流；按用户的精细限流在 BFF 内实现）
    # ------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m  rate=30r/s;   # 常规 API
    limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/s;    # 登录/注册等敏感端点
    limit_req_status 429;

    # ------------------------------------------------------------------
    # BFF upstream
    # 负载均衡扩展示例（横向扩容后取消注释并登记实例，Compose 多副本可用
    # `docker compose up -d --scale bff=3` + DNS 轮询，或显式列出）：
    #   upstream bff_backend {
    #       least_conn;                  # 最少连接优先，适合长连接/SSE 场景
    #       server bff-1:8000;
    #       server bff-2:8000;
    #       server bff-3:8000;
    #       keepalive 32;
    #   }
    # ------------------------------------------------------------------
    upstream bff_backend {
        server bff:8000;
        keepalive 32;
    }

    # Billing upstream（仅支付渠道 webhook 入口直连；业务接口一律走 BFF 代理）
    upstream billing_backend {
        server billing:8006;
        keepalive 16;
    }

    # ==================================================================
    # HTTP :80
    # 当前默认：纯 HTTP 反代（内网/开发环境开箱可用）。
    # 生产启用 HTTPS：将证书与私钥放入 infra/nginx/certs/
    #   infra/nginx/certs/eduagent.crt      # 证书链（fullchain）
    #   infra/nginx/certs/eduagent.key      # 私钥
    # 然后：
    #   1) 取消本 server 块中 location / 的注释，改用 308 跳转 HTTPS；
    #   2) 取消下方 HTTPS server 块的注释；
    #   3) `docker compose restart nginx`。
    # ==================================================================
    server {
        listen      80;
        server_name _;

        # compose 健康检查端点（见 docker-compose.yml nginx.healthcheck）
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        # 生产启用 HTTPS 后改为跳转：
        # location / { return 308 https://$host$request_uri; }

        include /etc/nginx/conf.d/eduagent_locations.conf;
    }

    # ==================================================================
    # HTTPS :443（SSL 终止）—— 证书就位后整体取消注释
    # ==================================================================
    # server {
    #     listen      443 ssl;
    #     http2       on;
    #     server_name api.eduagent.example.com;   # TODO: 替换为正式域名
    #
    #     # ---- 证书路径占位（挂载自 infra/nginx/certs/）----
    #     ssl_certificate     /etc/nginx/certs/eduagent.crt;
    #     ssl_certificate_key /etc/nginx/certs/eduagent.key;
    #
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #
    #     # 安全响应头
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Content-Type-Options nosniff always;
    #     add_header X-Frame-Options DENY always;
    #
    #     location = /healthz {
    #         access_log off;
    #         add_header Content-Type text/plain;
    #         return 200 'ok';
    #     }
    #
    #     include /etc/nginx/conf.d/eduagent_locations.conf;
    # }
}
